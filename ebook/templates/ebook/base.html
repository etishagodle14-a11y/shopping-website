{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apna Mart</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    
    <style>
        body { background-color: #f1f3f6; font-family: Roboto, Arial, sans-serif; margin: 0; }
        
        /* Fixed Purple Header */
        .fk-navbar { 
            background-color: #51295a; 
            padding: 12px 0; 
            position: sticky; 
            top: 0; 
            z-index: 1000; 
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
        }

        .header-flex {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
        }

        .logo { 
            font-size: 24px; 
            font-weight: 800; 
            color: white; 
            text-decoration: none; 
            font-style: italic; 
            min-width: 180px;
        }

        .search-container { 
            background: white; 
            border-radius: 4px; 
            display: flex; 
            align-items: center; 
            padding: 0 15px; 
            height: 42px; 
            flex-grow: 1; 
            max-width: 700px; 
        }

        .search-input { border: none; width: 100%; outline: none; font-size: 15px; }

        .header-icons { display: flex; align-items: center; gap: 30px; }
        
        .nav-icon-item { 
            color: white; 
            text-decoration: none; 
            text-align: center; 
            font-size: 13px; 
            font-weight: 500;
            transition: 0.3s;
        }
        .nav-icon-item:hover { opacity: 0.8; color: #ffc107; }
        .nav-icon-item i { font-size: 20px; display: block; margin-bottom: 2px; }

        /* Mobile Bottom Nav Bar */
        .bottom-nav { 
            position: fixed; 
            bottom: 0; 
            width: 100%; 
            background: white; 
            display: none; 
            justify-content: space-around; 
            padding: 10px 0; 
            box-shadow: 0 -2px 15px rgba(0,0,0,0.1); 
            z-index: 2000; 
            border-top: 1px solid #eee; 
        }
        .bottom-nav-item { text-decoration: none; color: #666; font-size: 11px; text-align: center; }
        .bottom-nav-item i { font-size: 22px; display: block; }
        .bottom-nav-item.active { color: #51295a; font-weight: bold; }

        /* Main Content Spacing */
        .main-body { padding-top: 20px; min-height: 80vh; }

        @media (max-width: 991px) {
            .header-icons { display: none; } 
            .bottom-nav { display: flex; }
            /* FIXED: Extra padding taaki checkout button na chhupe */
            body { padding-bottom: 90px !important; } 
            .logo { font-size: 18px; min-width: auto; }
            .main-body { padding-top: 10px; }
        }
    </style>
</head>
<body>

<header class="fk-navbar">
    <div class="container">
        <div class="header-flex">
            <a href="/" class="logo">APNA MART <i class="bi bi-gift-fill" style="font-size: 16px;"></i></a>
            
            <form action="{% url 'all_products' %}" method="GET" class="search-container">
                <i class="bi bi-search text-muted me-2"></i>
                <input type="text" name="q" class="search-input" placeholder="Try Saree, Kurti or Product Code">
            </form>

            <div class="header-icons">
                <a href="{% url 'offer_zone' %}" class="nav-icon-item"><i class="bi bi-lightning-charge"></i>Offers</a>
                <a href="{% url 'view_wishlist' %}" class="nav-icon-item"><i class="bi bi-heart"></i>Wishlist</a>
                <a href="{% url 'view_cart' %}" class="nav-icon-item"><i class="bi bi-cart3"></i>Cart</a>
                
                {% if user.is_authenticated %}
                <a href="{% url 'my_orders' %}" class="nav-icon-item"><i class="bi bi-bag-check"></i>Orders</a>
                <a href="{% url 'logout' %}" class="nav-icon-item"><i class="bi bi-power text-danger"></i>Exit</a>
                {% else %}
                <a href="{% url 'login' %}" class="nav-icon-item"><i class="bi bi-person-circle"></i>Login</a>
                {% endif %}
            </div>
        </div>
    </div>
</header>

<nav class="bottom-nav">
    <a href="/" class="bottom-nav-item"><i class="bi bi-house-door"></i>Home</a>
    <a href="{% url 'all_products' %}?mode=categories" class="bottom-nav-item"><i class="bi bi-grid"></i>Categories</a>
    <a href="{% url 'my_orders' %}" class="bottom-nav-item"><i class="bi bi-bag-check"></i>Orders</a>
    
    {% if user.is_authenticated %}
    <a href="{% url 'view_wishlist' %}" class="bottom-nav-item"><i class="bi bi-heart"></i>Wishlist</a>
    {% else %}
    <a href="{% url 'login' %}" class="bottom-nav-item"><i class="bi bi-person-circle"></i>Account</a>
    {% endif %}
</nav>

<div class="main-body">
    {% block content %}{% endblock %}
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script>
    // URL ke hisaab se active class lagane ke liye
    document.querySelectorAll('.bottom-nav-item').forEach(link => {
        if(window.location.href.includes(link.href)){
            link.classList.add('active');
        }
    });
</script>

</body>
</html>
