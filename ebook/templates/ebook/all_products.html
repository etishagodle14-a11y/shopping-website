{% extends 'ebook/base.html' %}

{% block content %}
<div class="container mt-4">
    <h4 class="fw-bold mb-4">All Products</h4>
    <div class="row row-cols-2 row-cols-md-4 row-cols-lg-5 g-3">
        {% for product in products %}
        <div class="col">
            <div class="card h-100 border-0 shadow-sm">
                <a href="{% url 'product_detail' product.id %}" class="text-decoration-none text-dark">
                    <div style="height: 180px; display: flex; align-items: center; justify-content: center; background: #fff;">
                        {% if product.image %}
                            <img src="{{ product.image.url }}" style="max-height: 100%; max-width: 100%; object-fit: contain;">
                        {% endif %}
                    </div>
                    <div class="card-body text-center p-2">
                        <div class="fw-bold small text-truncate">{{ product.name }}</div>
                        <div class="text-success">₹{{ product.price }}</div>
                    </div>
                </a>
            </div>
        </div>
        {% endfor %}
    </div>
</div>
{% endblock %}
